  <!-- Theme-tintable monochrome chip.
       - Rounded square background = currentColor (tinted at runtime).
       - Paper window + carrot body + leaves are cut out via <mask> so the
         surrounding page background shows through (acts as the "paper" and as
         the carrot's / leaves' interior), guaranteeing they stay visible even
         where they overlap the same-colored square.
       - The carrot is drawn as STROKE-ONLY (fill none) so it reads as an
         outlined shape rather than merging into the background.
       - The 4 leaves are merged into a single OUTER OUTLINE (fill none, stroke
         currentColor) so no internal crossing lines appear between them. -->

name: safenotes
description: Encrypted, private note manager
homepage: https://github.com/mcxiaoke/CarroNote
documentation: https://github.com/mcxiaoke/CarroNote
publish_to: 'none'

version: 3.0.0+30000

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

# Dart pub workspaces：核心逻辑独立为纯 Dart 包，编译器强制禁止 Flutter 依赖
workspace:
  - packages/core

dependencies:
  flutter:
    sdk: flutter

  # 核心逻辑包（加密 / 数据库 / 同步引擎，纯 Dart）
  core:
    path: packages/core

  after_layout: ^1.2.0
  auto_size_text: ^3.0.0
  crypto: ^3.0.3
  device_info_plus: ^12.0.0
  easy_localization: ^3.0.8
  file_picker: ^11.0.2  # 12.x 仍为 beta，暂保持稳定版
  flutter_secure_storage: ^10.3.1
  flutter_staggered_grid_view: ^0.7.0
  intl: ^0.20.2
  local_auth: ^3.0.2
  meta: ^1.15.0
  local_session_timeout: ^3.2.0
  logger: ^2.1.0
  media_scanner: ^2.1.0
  modal_bottom_sheet: ^3.0.0
  # Material Motion 官方动画（卡片 → 详情页的 ContainerTransform 放大转场）
  animations: ^2.2.0
  path: ^1.9.0
  path_provider: ^2.0.2
  permission_handler: ^12.0.3
  provider: ^6.0.3
  rename: ^3.0.2
  shared_preferences: ^2.0.6
  shared_preferences_platform_interface: ^2.4.2  # 自定义 prefs 存储后端（SharedPreferencesStorePlatform）
  # 桌面端窗口管理（Windows/macOS/Linux）：最小尺寸限制、居中、程序化调整窗口
  window_manager: 0.5.1
  sqflite: ^2.4.3
  sqflite_common: ^2.5.11
  sqflite_common_ffi: ^2.4.2  # 桌面端 SQLite（Windows/macOS/Linux 运行时 + 测试）
  timeago: ^3.3.0
  tuple: ^2.0.0
  url_launcher: ^6.1.5

  # Markdown 渲染（编辑器预览 / 详情页排版）：flutter_markdown 官方接手维护版
  flutter_markdown_plus: ^1.0.12

  # 同步功能依赖
  http: ^1.1.0                # WebDAV HTTP 客户端
  args: ^2.5.0                # CLI（bin/safenotes_cli.dart）命令解析

  # 密码强度评估（基于 Dropbox zxcvbn 算法）
  zxcvbnm: ^1.1.1

  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  shadcn_ui: ^0.56.1
  awesome_extensions: ^2.1.1
  flutter_svg: ^2.3.0

  # 笔记历史版本 diff 计算（Myers 算法，纯 Dart 无原生依赖）
  diff_match_patch: ^0.4.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  path_provider_platform_interface: ^2.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  import_sorter: ^4.6.0
  dependency_validator: ^5.0.5
  flutter_lints: ^6.0.0
  material_color_utilities: ^0.13.0


# ============================================================
# 启动图标 / Splash 生成说明（源图：assets/images/icon.png）
#   - icon.png: 1024x1024、已去背景透明的 App 图标
#       由 icon_with_space.png 四周各裁 48px 得到
#       （或 icon_with_space_ts.png 同法裁剪，即 PS 去背景版，效果等价）
#   - splash_500.png / splash_12.png: 同样由 icon.png 生成
#       （splash_12 带 Android 12 安全区留白：图标主体直径≈334，居中于 576 画布）
# 根据 icon.png 生成全套资源的方法：
#   1. flutter pub get
#   2. dart run flutter_launcher_icons        # 生成 android/ios/web/windows 启动图标（含 Android 自适应图标）
#   3. python scripts/gen_splash.py           # ⚠️ 换图标后务必先跑：用新 icon.png 重生成 splash_500/splash_12 源图
#   4. dart run flutter_native_splash:create  # 把源图烤进 android/ios/web 的 splash
#   注意：flutter_native_splash:create 只读取 splash_500.png / splash_12.png 作为输入源图，
#         不会反向生成它们。若只跑 :create 而不先重生成这两个 PNG，splash 仍是旧图标。
# 注意：Android 8+ 走 mipmap-anydpi-v26 自适应图标（adaptive_icon_background/foreground），
#       务必保证该 XML 指向新资源，否则安装后图标不更新。
# ============================================================

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with app, so that app can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/translations/
    - assets/web/

  fonts:
    - family: NotoSerif
      fonts:
        - asset: assets/fonts/NotoSerif-Regular.ttf

    - family: MerriweatherBlack
      fonts:
        - asset: assets/fonts/Merriweather-Black.ttf

    - family: NotoMonochromaticEmoji
      fonts:
        - asset: assets/fonts/NotoEmoji-VariableFont_wght.ttf

import_sorter:
  emojis: false # Optional, defaults to false
  comments: false # Optional, defaults to true
  ignored_files: # Optional, defaults to []
    - \/temp\/*

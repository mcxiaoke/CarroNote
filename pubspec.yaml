name: safenotes
description: Encrypted, private note manager
homepage: https://safenotes.dev/
documentation: https://safenotes.dev/
publish_to: 'none'

version: 2.3.0+10

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

# Dart pub workspaces：核心逻辑独立为纯 Dart 包，编译器强制禁止 Flutter 依赖
workspace:
  - packages/core

dependencies:
  flutter:
    sdk: flutter

  # 核心逻辑包（加密 / 数据库 / 同步引擎，纯 Dart）
  core:
    path: packages/core

  after_layout: ^1.2.0
  auto_size_text: ^3.0.0
  crypto: ^3.0.3
  cupertino_icons: ^1.0.6
  device_info_plus: ^12.0.0
  easy_localization: ^3.0.1
  file_picker: ^11.0.2  # 12.x 仍为 beta，暂保持稳定版
  flutter_secure_storage: ^10.3.1
  flutter_staggered_grid_view: ^0.7.0
  intl: ^0.20.2
  local_auth: ^3.0.2
  meta: ^1.15.0
  local_session_timeout: ^3.2.0
  logger: ^2.1.0
  media_scanner: ^2.1.0
  modal_bottom_sheet: ^3.0.0
  page_transition: ^2.0.9
  path: ^1.9.0
  path_provider: ^2.0.2
  permission_handler: ^12.0.3
  provider: ^6.0.3 
  rename: ^3.0.2
  settings_ui: ^3.0.1
  shared_preferences: ^2.0.6
  sqflite: ^2.4.3
  sqflite_common: ^2.5.11
  sqflite_common_ffi: ^2.4.2  # 桌面端 SQLite（Windows/macOS/Linux 运行时 + 测试）
  timeago: ^3.3.0
  tuple: ^2.0.0
  url_launcher: ^6.1.5

  # 同步功能依赖
  http: ^1.1.0                # WebDAV HTTP 客户端
  args: ^2.5.0                # CLI（bin/safenotes_cli.dart）命令解析

  # 密码强度评估（基于 Dropbox zxcvbn 算法）
  zxcvbnm: ^1.1.1

  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  flex_color_scheme: ^8.4.0
    

dev_dependencies:
  flutter_test:
    sdk: flutter
  path_provider_platform_interface: ^2.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  import_sorter: ^4.6.0
  dependency_validator: ^5.0.5
  flutter_lints: ^6.0.0


flutter_native_splash:
  color: "#ECEFF4"
  image: assets/images/splash_500.png
  color_dark: "#2E3440"
  image_dark: assets/images/splash_500.png

  android_12:
    color: "#ECEFF4"
    icon_background_color: "#ECEFF4"
    image: assets/images/splash_12.png
    color_dark: "#2E3440"
    icon_background_color_dark: "#2E3440"
    image_dark: assets/images/splash_12.png

  fullscreen: true



flutter_launcher_icons:
  android: true
  image_path: "assets/images/icon.png"
  min_sdk_android: 25
  ios: true
  remove_alpha_ios: true
  image_path_ios: "assets/images/icon_no_alpha_ios.png"

  

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with app, so that app can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/translations/

  fonts:
    - family: NotoSerif
      fonts:
        - asset: assets/fonts/NotoSerif-Regular.ttf
    
    - family: MerriweatherBlack
      fonts:
        - asset: assets/fonts/Merriweather-Black.ttf

    - family: NotoMonochromaticEmoji
      fonts:
        - asset: assets/fonts/NotoEmoji-VariableFont_wght.ttf
